name: Daily Maritime Trends

on:
  schedule:
    # 15:00 UTC = 00:00 KST (Asia/Seoul) the next day.
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-maritime-news
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Research today's maritime trends
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/daily-news.mjs

      - name: Check for content changes
        id: changes
        run: |
          if git diff --quiet -- src/content/en/news.ts src/content/ko/news.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Type-check and lint
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Build (Cloudflare/OpenNext)
        if: steps.changes.outputs.changed == 'true'
        run: npm run cf:build

      - name: Commit and push new trend cards
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "drjangmaritime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/en/news.ts src/content/ko/news.ts
          git commit -m "Add daily maritime trends ($(date -u +%Y-%m-%d))"
          git push

      - name: Deploy to Cloudflare Workers
        if: steps.changes.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy
