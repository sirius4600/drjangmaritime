name: Deploy on Push

on:
  push:
    branches: [main]

concurrency:
  group: deploy-on-push
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Safety net: the resume (private-source-docs/, resume/, and the
      # unlisted public/resume-*.html page) is normally regenerated by the
      # local pre-commit hook before a commit lands — this re-runs it here
      # too so a commit made with a missing/bypassed hook still deploys a
      # fresh resume instead of a stale one.
      - name: Regenerate resume
        run: npm run resume:generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build and deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy
